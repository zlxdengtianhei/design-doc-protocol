[project]
name = "design-doc-protocol"
version = "0.6.0"
description = "Version-bound design document updates and portable agent skills"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["markdown-it-py==4.0.0"]

[project.scripts]
ddp = "ddp.cli:main"
ddp-install = "ddp_install.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["ddp/docs/**"]

[tool.hatch.build.targets.wheel]
packages = ["ddp", "ddp_install"]

[tool.hatch.build.targets.wheel.force-include]
"skills/design-doc-protocol" = "ddp_install/resources/design-doc-protocol"
"skills/clean-context" = "ddp_install/resources/clean-context"
".dsh/skills/design-doc-protocol/scripts/workflow.py" = "ddp_install/resources/design-doc-protocol/scripts/workflow.py"

[tool.hatch.build.targets.sdist]
only-include = ["ddp", "ddp_install", "skills", ".dsh/skills/design-doc-protocol/scripts/workflow.py", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
